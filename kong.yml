_format_version: "3.0"
_transform: true

consumers:
  - username: company-a
    keyauth_credentials:
      - key: company-a-demo-key

  - username: company-b
    keyauth_credentials:
      - key: company-b-demo-key

services:
  - name: inventory-grpc-service
    protocol: grpc
    host: inventory-service
    port: 50051
    routes:
      - name: inventory-grpc-route
        protocols:
          - grpc
        hosts:
          - inventory.local

      - name: inventory-rest-route
        protocols:
          - http
        paths:
          - /v1/stock

    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_header: true
          key_in_query: false
          key_in_body: false
          hide_credentials: true
          run_on_preflight: false

      - name: rate-limiting
        config:
          minute: 100
          policy: local

      - name: grpc-gateway
        route: inventory-rest-route
        config:
          proto: /kong/proto/inventory.proto

      - name: cors
        route: inventory-rest-route
        config:
          origins:
            - "*"
          methods:
            - GET
          headers:
            - Accept
            - Content-Type
            - apikey
          exposed_headers:
            - grpc-status
            - grpc-message
          preflight_continue: false
